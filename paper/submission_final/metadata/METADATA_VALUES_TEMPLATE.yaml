# Reconciliation gates (policy: METADATA_RECONCILIATION_GATES.md). An external answer can change the truth of
# existing factual prose; YAML substitution alone must then not produce the final build. For each gate an author
# records the outcome (one of allowed_outcomes), who decided, when and on which evidence, and the resolved wording:
#   - "CURRENT WORDING RETAINED" when the answer confirms the current wording (still an explicit RESOLVED record);
#   - or a list of edits {region, from, to}, applied only inside the gate's reconcilable regions.
# status: OPEN -> RESOLVED. --final fails while any gate is OPEN.
reconciliation_gates:
  R1:
    trigger: answers to B01-B06 (M06-M10 sensor model, accuracy, resolution, response time, placement), including "unavailable"
    affected_locations: [manuscript 3.1 Data and Cohort (region sensor_methods), manuscript 5.5 Limitation 4 (region limitation_4)]
    current_statement: >-
      3.1: "The temperature–humidity sensor model, its accuracy, resolution and response time, and its position relative
      to the body and the heater are not documented in the delivered data and are not assumed here", followed by the
      sensor-methods sentence with the M06-M10 tokens. Limitation 4: "The temperature–humidity sensor model, accuracy,
      resolution, response time and placement were not documented; the targets are treated as mat-level measurements,
      and no statement about measurement validity or physical mechanisms is made."
    external_evidence_required: >-
      The data provider's or manufacturer's written answer (datasheet or statement) for each of model, accuracy,
      resolution, response time, placement in the mat and placement relative to the heater, or a written statement
      that the item is not available.
    allowed_outcomes:
      R1-1: all six items unavailable (M06-M10 UNAVAILABLE); keep the P16 wording; the sensor-methods sentence is removed automatically
      R1-2: some items confirmed; add the confirmed specifications in 3.1; keep only the unconfirmed items in the not-documented sentence and in Limitation 4
      R1-3: all items confirmed; describe them in 3.1; remove the no-longer-true not-documented statements from 3.1 and Limitation 4, keep any other unresolved limitation
    author_decision: {outcome: null, decided_by: null, date: null, evidence: null}
    resolved_wording: null
    status: OPEN
  R2:
    trigger: answer to B08 (data-provider approval of the aggregate heater-diagnostic results and code; M16)
    affected_locations: [manuscript Data Availability Statement (region heater_approval)]
    current_statement: >-
      "Aggregate diagnostic results and the analysis code may be included in the research release, subject to final
      author and data-provider approval."
    external_evidence_required: The data provider's written approval or refusal, with any conditions.
    allowed_outcomes:
      R2-1: approved; keep the sentence, or state the actual inclusion
      R2-2: not approved; state that the aggregate results and code are not included, keeping that the controller-event records are not released
    author_decision: {outcome: null, decided_by: null, date: null, evidence: null}
    resolved_wording: null
    status: OPEN
  R3:
    trigger: answers to B07 (data redistribution) and A11 (code release) (M16)
    affected_locations: [manuscript Data Availability Statement (regions data_release and code_release)]
    current_statement: >-
      "The released data (...) are available at ... under the ... license." and "The released code (...) is available
      at ... under the ... license." (sentences assuming a public release)
    external_evidence_required: The data provider's redistribution permission and the authors' code-release decision, with repository, identifier and license.
    allowed_outcomes:
      R3-1: data and code are released; the sentences stay and their tokens are filled
      R3-2: data or code is not released; the corresponding sentence is replaced by the authors' statement of the actual availability (no "available upon request" unless the authors confirm it)
    author_decision: {outcome: null, decided_by: null, date: null, evidence: null}
    resolved_wording: null
    status: OPEN
  R4:
    trigger: answers to C04 and C05 (conference copyright and reuse; M05)
    affected_locations: [manuscript front-matter Note (region conference_note), cover letter Reuse statement (region cover_reuse)]
    current_statement: >-
      Cover letter: "no text, table or figure of the conference paper is reused, and its results are not compared
      numerically with the journal results"; manuscript Note: expanded version of the ICFICE 2026 paper, followed by
      the M05 copyright token.
    external_evidence_required: The published conference paper and the signed copyright agreement, checked item by item in CONFERENCE_REUSE_CHECK.md.
    allowed_outcomes:
      R4-1: no reuse confirmed; keep the current wording
      R4-2: reuse confirmed; revise the Note and the cover letter to name the reused material, with citation and the permission actually obtained
    author_decision: {outcome: null, decided_by: null, date: null, evidence: null}
    resolved_wording: null
    status: OPEN

